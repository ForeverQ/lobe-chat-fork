name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: '17 0 * * 6' # every week (Saturday at 00:17 UTC)
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync upstream changes
        id: sync
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/lobehub/lobe-chat.git
          else
            git remote add upstream https://github.com/lobehub/lobe-chat.git
          fi

          git fetch origin next
          git fetch upstream canary
          git checkout -B next origin/next

          if ! git merge upstream/canary --no-edit; then
            conflicted_files="$(git diff --name-only --diff-filter=U)"

            if [ "$conflicted_files" = '.github/workflows/sync.yml' ]; then
              echo 'Resolving sync workflow conflict by keeping the fork workflow.'
              git checkout --ours .github/workflows/sync.yml
              git add .github/workflows/sync.yml
              git commit --no-edit
            else
              echo 'Merge conflict while syncing upstream/canary into next.'
              echo 'Conflicted files:'
              echo "$conflicted_files"

              if [ -f .git/MERGE_HEAD ]; then
                git merge --abort
              fi
              exit 1
            fi
          fi

          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/next)" ]; then
            echo 'No upstream changes to push.'
          else
            git push origin next
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Sync failure summary
        if: failure()
        continue-on-error: true
        run: |
          {
            echo '## Upstream sync failed'
            echo
            echo 'The upstream sync workflow failed. Check the failed step logs in this Actions run.'
            echo
            echo 'If GitHub paused scheduled updates because the upstream workflow changed, manually run Sync Fork once and then re-run this workflow.'
            echo
            echo '- Tutorial (zh-CN): https://lobehub.com/zh/docs/self-hosting/advanced/upstream-sync'
            echo '- Tutorial (en-US): https://lobehub.com/docs/self-hosting/advanced/upstream-sync'
          } >> "$GITHUB_STEP_SUMMARY"
