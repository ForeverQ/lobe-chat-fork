name: Upstream Sync

permissions:
  contents: write
  issues: write
  actions: write

on:
  schedule:
    - cron: '17 0 * * 6' # every week (Saturday at 00:17 UTC)
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Clean issue notice
        run: |
          gh issue list --label '🚨 Sync Fail' --state open --json number --jq '.[].number' | while read -r issue_number; do
            if [ -n "$issue_number" ]; then
              gh issue close "$issue_number" --comment 'Closing stale sync failure issue after new sync attempt.'
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Sync upstream changes
        id: sync
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git remote add upstream https://github.com/lobehub/lobehub.git
          git fetch upstream canary
          git checkout next

          git merge upstream/canary --no-edit

          git push origin next

      - name: Sync check
        if: failure()
        run: |
          gh label create '🚨 Sync Fail' --color FF4D4F --description 'Upstream sync workflow failure' || true
          gh issue create \
            --title '🚨 同步失败 | Sync Fail' \
            --label '🚨 Sync Fail' \
            --body "$ISSUE_BODY"
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_BODY: |
            Due to a change in the workflow file of the [LobeChat][lobechat] upstream repository, GitHub has automatically suspended the scheduled automatic update. You need to manually sync your fork. Please refer to the detailed [Tutorial][tutorial-en-US] for instructions.

            由于 [LobeChat][lobechat] 上游仓库的 workflow 文件变更，导致 GitHub 自动暂停了本次自动更新，你需要手动 Sync Fork 一次，请查看 [详细教程][tutorial-zh-CN]

            ![](https://github-production-user-asset-6210df.s3.amazonaws.com/17870709/273954625-df80c890-0822-4ac2-95e6-c990785cbed5.png)

            [lobechat]: https://github.com/lobehub/lobe-chat
            [tutorial-zh-CN]: https://lobehub.com/zh/docs/self-hosting/advanced/upstream-sync
            [tutorial-en-US]: https://lobehub.com/docs/self-hosting/advanced/upstream-sync
